[package]
name = "prxvc-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "prxvc-desktop"
path = "src/main.rs"

# One direction of the real pipeline on a WAV file, with a latency report (design CT-15). A development
# tool: it needs the native features and the models installed (scripts/dev). Not part of the bundle.
[[bin]]
name = "call_harness"
path = "src/bin/call_harness/main.rs"

# The assistant's voice loop on a WAV file with the real providers and the local dialogue server, with
# a latency report (work package CT-20). A development tool like `call_harness`: it needs the native
# features and the models installed. It opens no microphone and plays nothing.
[[bin]]
name = "assistant_harness"
path = "src/bin/assistant_harness/main.rs"

# Development helpers for this machine (scripts/dev); not part of the product bundle.
[[bin]]
name = "prxvc-dev"
path = "src/bin/prxvc_dev/main.rs"

[dependencies]
prxvc-audio = { workspace = true }
prxvc-adapters = { workspace = true }
prxvc-providers = { workspace = true }
prxvc-models = { workspace = true }
prxvc-media = { workspace = true }
prxvc-ports = { workspace = true }
prxvc-session = { workspace = true }
prxvc-desktop-ui = { workspace = true }
prxvc-config = { workspace = true }
prxvc-observe = { workspace = true }
prxvc-storage = { workspace = true }
prxvc-i18n = { workspace = true }
directories = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
global-hotkey = { workspace = true }
sys-locale = { workspace = true }
tray-icon = { workspace = true }

[features]
default = []
# Native runtimes, built as dynamic libraries and shipped in the bundle's Contents/Frameworks.
# `qwentts`: the in-process text-to-speech engine of `prxvc-adapters`. Off by default, additive.
# `transcribe`: the in-process recognition runtime (Silero VAD and Qwen3-ASR). Off by default, additive.
# Each also turns on the provider registry's feature of the same name, so that the registry can build
# the provider (`prxvc-providers`). The registry itself is always built in: without a feature, the call
# reports the runtime as a typed problem ("not built in") instead of failing silently.
qwentts = ["prxvc-adapters/qwentts", "prxvc-providers/qwentts"]
transcribe = ["prxvc-adapters/transcribe", "prxvc-providers/transcribe"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
# Scriptable fakes of every port: the host's tests run a real session loop on them.
prxvc-ports = { workspace = true, features = ["fakes"] }
