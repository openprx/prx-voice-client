[package]
name = "prxvc-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prxvc-session = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
prxvc-media = { workspace = true }
prxvc-ports = { workspace = true }
# Private runtime of the streaming MT client: one task per request, so that a
# cancelled request drops its connection (`mt::openai_chat`).
tokio = { workspace = true }

# The TTS adapter needs only the workspace resampler.
prxvc-audio = { workspace = true }
# Prepared-voice cache keys and the model fingerprint.
sha2 = { workspace = true }
# Lock and condition variable of the job queue.
parking_lot = { workspace = true }
# Raw bindings of the `qwentts` feature.
prxvc-qwentts-sys = { workspace = true, optional = true }
# Raw bindings of the `transcribe` feature.
prxvc-transcribe-sys = { workspace = true, optional = true }
# Raw bindings of the `apple-translation` feature.
prxvc-apple-translation-sys = { workspace = true, optional = true }

[features]
default = []
# The in-process `qwentts.cpp` engine behind `tts::qwentts::QwenTts`: builds the vendored C++ runtime
# (cmake, clang) and links it as a dynamic library. Off by default, additive (CS-7.5).
qwentts = ["dep:prxvc-qwentts-sys", "prxvc-qwentts-sys/qwentts"]
# The in-process `transcribe.cpp` runtime behind `vad::SileroVad` and `asr::QwenAsr`: builds the
# vendored C++ runtime and links it as a second dynamic library. Off by default, additive (CS-7.5).
transcribe = ["dep:prxvc-transcribe-sys", "prxvc-transcribe-sys/transcribe"]
# System translation through Apple's on-device Translation framework (`mt::apple`): compiles the
# Swift bridge with `swiftc` and links it as a third dynamic library. macOS only. Off by default,
# additive (CS-7.5).
apple-translation = ["dep:prxvc-apple-translation-sys", "prxvc-apple-translation-sys/apple-translation"]

# Live check of system translation against the real framework. Its own `main` (no test harness):
# the framework needs the main thread to run its run loop, so the checks run on a second thread.
# Ignored unless `--ignored` is passed; needs the zh-Hans and en language packs.
[[test]]
name = "apple_translation_live"
path = "tests/apple_translation_live.rs"
harness = false
required-features = ["apple-translation"]

[dev-dependencies]
tempfile = { workspace = true }
# Scripted fakes of the ports, for the VAD stream tests.
prxvc-ports = { workspace = true, features = ["fakes"] }

[lints]
workspace = true
