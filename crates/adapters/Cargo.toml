[package]
name = "prxvc-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prxvc-session = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
prxvc-media = { workspace = true }
prxvc-ports = { workspace = true }
# Private runtime of the streaming MT client: one task per request, so that a
# cancelled request drops its connection (`mt::openai_chat`).
tokio = { workspace = true }

# The TTS adapter needs only the workspace resampler, so the Whisper recogniser stays off here;
# the `integration` feature turns it back on.
prxvc-audio = { workspace = true, default-features = false }
# Prepared-voice cache keys and the model fingerprint.
sha2 = { workspace = true }
# Lock and condition variable of the job queue.
parking_lot = { workspace = true }
# Raw bindings of the `qwentts` feature.
prxvc-qwentts-sys = { workspace = true, optional = true }

[features]
default = []
# Enables the audio-wired end-to-end example (capture → ASR → driver → playback).
integration = ["prxvc-audio/whisper"]
# The in-process `qwentts.cpp` engine behind `tts::qwentts::QwenTts`: builds the vendored C++ runtime
# (cmake, clang) and links it as a dynamic library. Off by default, additive (CS-7.5).
qwentts = ["dep:prxvc-qwentts-sys", "prxvc-qwentts-sys/qwentts"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
