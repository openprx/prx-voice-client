[package]
name = "prxvc-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prxvc-session = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }

# The TTS adapter needs only the workspace resampler. Default features stay on because
# `prxvc-audio --no-default-features` does not build at present (`audio_loop.rs` names
# `EchoGateHandle` outside its `whisper` gate); once it does, this line drops the recogniser.
prxvc-audio = { workspace = true }
prxvc-media = { workspace = true }
prxvc-ports = { workspace = true }
# Prepared-voice cache keys and the model fingerprint.
sha2 = { workspace = true }
# Lock and condition variable of the job queue.
parking_lot = { workspace = true }
# Raw bindings of the `qwentts` feature.
prxvc-qwentts-sys = { workspace = true, optional = true }

[features]
default = []
# Enables the audio-wired end-to-end example (capture → ASR → driver → playback).
integration = ["prxvc-audio/whisper"]
# The in-process `qwentts.cpp` engine behind `tts::qwentts::QwenTts`: builds the vendored C++ runtime
# (cmake, clang) and links it as a dynamic library. Off by default, additive (CS-7.5).
qwentts = ["dep:prxvc-qwentts-sys", "prxvc-qwentts-sys/qwentts"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
