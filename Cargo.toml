[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/session",
    "crates/audio",
    "crates/protocol",
    "crates/config",
    "crates/storage",
    "crates/observe",
    "crates/security",
    "crates/ffi",
    "crates/desktop-ui",
    "crates/testkit",
    "crates/i18n",
    "crates/adapters",
    "crates/models",
    "crates/providers",
    "crates/media",
    "crates/ports",
    "crates/native/qwentts-sys",
    "crates/native/transcribe-sys",
    "crates/native/apple-translation-sys",
    "crates/native/link",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openprx/prx-voice-client"

[workspace.dependencies]
# Internal crates
prxvc-core = { path = "crates/core" }
prxvc-session = { path = "crates/session" }
prxvc-audio = { path = "crates/audio" }
prxvc-protocol = { path = "crates/protocol" }
prxvc-config = { path = "crates/config" }
prxvc-storage = { path = "crates/storage" }
prxvc-observe = { path = "crates/observe" }
prxvc-security = { path = "crates/security" }
prxvc-ffi = { path = "crates/ffi" }
prxvc-desktop-ui = { path = "crates/desktop-ui" }
prxvc-testkit = { path = "crates/testkit" }
prxvc-i18n = { path = "crates/i18n" }
prxvc-adapters = { path = "crates/adapters" }
prxvc-models = { path = "crates/models" }
prxvc-providers = { path = "crates/providers" }
prxvc-media = { path = "crates/media" }
prxvc-ports = { path = "crates/ports" }
prxvc-qwentts-sys = { path = "crates/native/qwentts-sys" }
prxvc-transcribe-sys = { path = "crates/native/transcribe-sys" }
prxvc-apple-translation-sys = { path = "crates/native/apple-translation-sys" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
futures = { version = "0.3" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
toml = { version = "0.8" }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# Observability
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UI (desktop)
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "clipboard", "links", "system_fonts", "accesskit"] }

# Operating-system interface language (already part of the dependency tree through eframe)
sys-locale = { version = "0.3" }

# Audio
cpal = { version = "0.15" }
rubato = { version = "0.15" }

# Native build (Core Audio Tap shim on macOS)
cc = { version = "1" }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = { version = "0.12" }
tokio-tungstenite = { version = "0.26" }
reqwest = { version = "0.12", features = ["json"] }
url = { version = "2" }
directories = { version = "6" }
sha2 = { version = "0.10" }
fs4 = { version = "1" }
semver = { version = "1", features = ["serde"] }
libc = { version = "0.2" }
tempfile = { version = "3" }
global-hotkey = { version = "0.6" }
tray-icon = { version = "0.19" }

[workspace.lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.dev]
opt-level = 0
debug = true
