name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linux and Windows are not supported yet: the desktop application, the audio
  # layer's capture and virtual-microphone code and the call tooling are macOS
  # only (Core Audio process tap, virtual microphone driver). The full workspace
  # is therefore checked and tested on macOS; Linux keeps a compile, lint and
  # test run of the platform-neutral crates (everything except `prxvc-desktop`).
  # To restore Linux and Windows for the whole workspace, `apps/desktop` needs
  # Linux and Windows implementations (or `cfg` gating) of `call_kit`, the
  # call harness and dev binaries, tray and routing recovery, and the audio
  # crate's rustdoc must stop linking to macOS-only modules.
  check:
    name: Check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check compilation
        run: cargo check --workspace

  check-linux:
    name: Check portable crates (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxdo-dev

      - name: Clippy
        run: cargo clippy --workspace --exclude prxvc-desktop --all-targets -- -D warnings

      - name: Check compilation
        run: cargo check --workspace --exclude prxvc-desktop

  test:
    name: Test (${{ matrix.os }})
    needs: [check, check-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --workspace
          - os: ubuntu-latest
            args: --workspace --exclude prxvc-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxdo-dev

      - name: Run tests
        run: cargo test ${{ matrix.args }}

  build-desktop:
    name: Build Desktop (macos-latest)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build release
        run: cargo build -p prxvc-desktop --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-latest
          path: target/release/prxvc-desktop
          if-no-files-found: warn

  build-ffi:
    name: Build FFI Library
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Build FFI (macOS host - staticlib)
        run: cargo build -p prxvc-ffi --release

      - name: Build FFI (iOS Simulator)
        run: cargo build -p prxvc-ffi --target aarch64-apple-ios-sim --release
        continue-on-error: true

      - name: Build FFI (iOS Device)
        run: cargo build -p prxvc-ffi --target aarch64-apple-ios --release
        continue-on-error: true

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docs:
    name: Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
